<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../global.css">
    <title>QuickFlows Dashboard</title>
</head>

<body>
    <div id="root">
        <div id="left">
            <label for="title" title="Enter a short title for this workflow">
                <h3>add title</h3>
            </label>
            <input id="title" type="text" placeholder="e.g., Development Setup">
            <label for="keybind" title="Add a keyboard shortcut (e.g., ctrl+shift+1)">
                <h3>add keybind</h3>
            </label>
            <input id="keybind" type="text" placeholder="press keybind">

            <label for="delay-input" title="Specify delay between actions in milliseconds">
                <h3>add delay</h3>
            </label>
            <input type="number" placeholder="Delay (ms)" id="delay-input">
            <label for="default_workflows">
                <h3>set up default workflow</h3>
            </label>
            <select name="default_workflow" id="default_workflows">
                <option default value="no_value">select</option>
                <option value="ctrl+shift+1">workflow 1 (default bind: ctrl+shift+1)</option>
                <option value="ctrl+shift+2">workflow 2 (default bind: ctrl+shift+2)</option>
                <option value="ctrl+shift+3">workflow 3 (default bind: ctrl+shift+3)</option>
            </select>
            <div id="private">
                <label for="incognito" title="Enable to run this workflow in incognito/private windows">
                    <h3>incognito mode?</h3>
                </label>
                <input type="checkbox" id="incognito" name="incognito">
            </div>
            <!-- run in current window or new window chekbox -->
            <div id="window">
                <label for="new_window" title="Enable to run this workflow in a new window">
                    <h3>run in new window?</h3>
                </label>
                <input type="checkbox" id="new_window" name="new_window">
            </div>

            <label for="links" title="Enter comma-separated URLs (e.g., https://site.com, https://example.com)">
                <h3>add links separated by new lines </h3>
            </label>
            <textarea name="links" id="links"
                placeholder="https://www.youtube.com/&#10;https://www.facebook.com/&#10;https://www.google.com/"></textarea>
            <button id="add-button">ADD</button>
            <p id="help"><a href="./help.html" target="_blank"
                    style="margin-top: 12px; display: block; font-size: 14px; font-weight: 600; color: var(--accent);">?
                    Help & Guide</a></p>
        </div>
        <div id="right">
            <h2>Data</h2>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>

</html>
